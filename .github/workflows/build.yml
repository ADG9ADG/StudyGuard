
name: Build StudyGuard APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

  
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools


      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project ZIP
        run: |
          mkdir -p build-source
          unzip -q StudyGuard-Android-Project.zip -d build-source

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find build-source -name settings.gradle.kts -print -quit)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyGuard-APK
          path: build-source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
